<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <meta name="robots" content="noindex" />
    <title>JSON Pretty Print</title>
  </head>
  <body>
    <p>
      <strong>JSON Pretty Print</strong> has moved to
      <a href="https://zerodevx.github.io/jpp/">https://zerodevx.github.io/jpp/</a>. Please update
      your bookmarks and any saved links.
    </p>
    <p>
      You are being redirected to our new site in <span id="counter">5</span> seconds. Or
      <a id="link" href="#">click here to skip ahead</a> immediately.
    </p>
    <script>
      const paths = location.pathname.split('/').filter(Boolean)
      const href = `https://zerodevx.github.io/jpp/#/${paths[paths.length - 1]}`
      document.querySelector('#link').href = href
      const counter = document.querySelector('#counter')
      let count = 5
      const interval = setInterval(function () {
        count--
        counter.textContent = count
        if (count <= 0) {
          clearInterval(interval)
          location.href = href
        }
      }, 1000)
    </script>
  </body>
</html>
